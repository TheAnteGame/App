# The Ante — manual job trigger.
# Replaces the old `?secret=` browser-trigger path (removed: secrets in URLs
# leak into logs). CRON_SECRET stays in GitHub Actions secrets; anyone with
# repo access can run a job from Actions → run-job → "Run workflow".

name: run-job

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which job route to run"
        required: true
        type: choice
        options:
          - lock-week
          - settle-games
          - sync-schedule
          - reconcile
      params:
        description: "Optional query string, e.g. week=1&sync=0"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: call job route
        run: |
          curl -sS --max-time 290 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://the-ante-inky.vercel.app/api/jobs/${{ inputs.job }}?${{ inputs.params }}" \
            -o response.json -w "%{http_code}" > status.txt
          echo "HTTP $(cat status.txt)"
          cat response.json
      - name: publish result to run-results branch (emails redacted)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '';
            try { body = fs.readFileSync('response.json', 'utf8'); } catch {}
            let status = '';
            try { status = fs.readFileSync('status.txt', 'utf8').trim(); } catch {}
            // Redact emails: the repo is public.
            try {
              const j = JSON.parse(body);
              const redact = (o) => {
                if (Array.isArray(o)) o.forEach(redact);
                else if (o && typeof o === 'object') {
                  if ('email' in o) o.email = String(o.email).slice(0, 3) + '…';
                  Object.values(o).forEach(redact);
                }
              };
              redact(j);
              body = JSON.stringify(j, null, 2);
            } catch {}
            const payload = JSON.stringify({
              run_id: context.runId,
              job: '${{ inputs.job }}',
              params: '${{ inputs.params }}',
              http_status: status,
              response: JSON.parse(body || 'null'),
            }, null, 2);
            const { owner, repo } = context.repo;
            const path = 'results/latest.json';
            let sha;
            try {
              const r = await github.rest.repos.getContent({ owner, repo, path, ref: 'run-results' });
              sha = r.data.sha;
            } catch {}
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'run-results',
              message: `run ${context.runId}: ${{ toJSON(inputs.job) }}`,
              content: Buffer.from(payload).toString('base64'),
              ...(sha ? { sha } : {}),
            });
